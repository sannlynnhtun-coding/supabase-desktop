[package]
name = "supabase-local-setup"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "supabase-local-setup"
path = "src/main.rs"

[[bin]]
name = "supabase-local-app"
path = "src/app.rs"

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
junction = "1"
fs2 = "0.4"
ureq = { version = "3", default-features = false, features = ["json"] }
tray-icon = { version = "0.21", default-features = false }
getrandom = "0.3"
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
strip = true
lto = "thin"
