name: Rust installer checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src/SupabaseLocal.Setup.Rust/Cargo.toml --check
      - run: cargo check --locked --manifest-path src/SupabaseLocal.Setup.Rust/Cargo.toml
      - run: cargo test --locked --manifest-path src/SupabaseLocal.Setup.Rust/Cargo.toml
